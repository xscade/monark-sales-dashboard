<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#17322d" />
    <title>Monark Sales · Offline</title>
    <style>
      :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#17322d;background:#f8f7f3}
      body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
      main{max-width:440px;border:1px solid #d9ddd9;border-radius:20px;background:#fff;padding:32px;box-shadow:0 16px 50px #17322d14}
      b{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#17322d;color:#fff;font-size:20px}
      h1{font-size:24px;letter-spacing:-.03em;margin:20px 0 8px}p{font-size:14px;line-height:1.65;color:#5f6965;margin:0}
      button{margin-top:22px;border:0;border-radius:10px;background:#168f67;color:#fff;font:inherit;font-weight:700;padding:11px 16px;cursor:pointer}
    </style>
  </head>
  <body>
    <main>
      <b>M</b>
      <h1>You are offline</h1>
      <p>The walk-in form can keep saving while its signed-in page remains open. Reconnect and reload to reopen a private form; customer and team data are never cached in a shared offline page.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
